name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The hook installer, patch scripts and PE readers target Windows games.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
      - name: Lint (errors and unused code)
        run: python -m ruff check src tests run.py build.py --select F,E9,PLE --target-version py310
      - name: Test
        run: python -m pytest -q
      - name: Runtime self-check
        run: python run.py --self-check
