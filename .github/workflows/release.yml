name: Release

on:
  push:
    tags:
      - '*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run test suite
        run: python -m pytest -q

      - name: Build standalone executable
        run: python build.py

      - name: Package standalone ZIP
        shell: powershell
        run: |
          $Version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          $ZipName = "UnityLocalizer-${Version}-windows-x64.zip"
          Compress-Archive -Path "dist\UnityLocalizer\*" -DestinationPath $ZipName -CompressionLevel Optimal
          echo "ZIP_PATH=$ZipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityLocalizer-windows-x64
          path: ${{ env.ZIP_PATH }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
